<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --cc-font-size: 28px;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        -webkit-user-select: none;
      }

      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }

      #stage.bottom {
        align-items: flex-end;
        padding-bottom: 6%;
      }

      #stage.top {
        align-items: flex-start;
        padding-top: 5%;
      }

      #caption {
        max-width: 82%;
        margin: 0 auto;
        padding: 0.25em 0.6em;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: var(--cc-font-size);
        font-weight: 500;
        line-height: 1.35;
        text-align: center;
        text-wrap: balance;
        white-space: pre-wrap;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        opacity: 0;
        transition: opacity 120ms ease-out;
      }

      #caption.visible {
        opacity: 1;
      }

      /* Badges stack top-right. The language badge sits above the transcription
         badge so it does not shift position when that one comes and goes. */
      #badges {
        position: absolute;
        top: 12px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }

      .badge {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.5);
        color: rgba(255, 255, 255, 0.85);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.01em;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 200ms ease-out;
      }

      .badge.visible {
        opacity: 1;
      }

      #status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4ade80;
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage" class="bottom">
      <div id="caption"></div>
    </div>
    <div id="badges">
      <div id="language" class="badge"><span id="language-text"></span></div>
      <div id="status" class="badge"><span class="dot"></span><span id="status-text"></span></div>
    </div>

    <script>
      const stage = document.getElementById("stage");
      const caption = document.getElementById("caption");
      const status = document.getElementById("status");
      const statusText = document.getElementById("status-text");
      const language = document.getElementById("language");
      const languageText = document.getElementById("language-text");

      let showStatus = true;

      iina.onMessage("config", (data) => {
        if (data.fontSize) {
          document.documentElement.style.setProperty("--cc-font-size", data.fontSize + "px");
        }
        stage.className = data.position === "top" ? "top" : "bottom";
        showStatus = data.showStatus !== false;
        if (!showStatus) status.classList.remove("visible");
      });

      iina.onMessage("cue", (data) => {
        const text = data && data.text;
        if (text) {
          caption.textContent = text;
          caption.classList.add("visible");
        } else {
          caption.classList.remove("visible");
        }
      });

      // The language badge is informational, so it announces itself and then gets
      // out of the way rather than sitting over the video for the whole file.
      const LANGUAGE_BADGE_MS = 5000;
      let languageTimer = null;

      iina.onMessage("language", (data) => {
        const text = data && data.text;
        if (languageTimer) {
          clearTimeout(languageTimer);
          languageTimer = null;
        }
        if (!text) {
          language.classList.remove("visible");
          return;
        }
        languageText.textContent = text;
        language.classList.add("visible");
        languageTimer = setTimeout(() => {
          language.classList.remove("visible");
          languageTimer = null;
        }, LANGUAGE_BADGE_MS);
      });

      iina.onMessage("status", (data) => {
        const text = data && data.text;
        if (text && showStatus) {
          statusText.textContent = text;
          status.classList.add("visible");
        } else {
          status.classList.remove("visible");
        }
      });
    </script>
  </body>
</html>
